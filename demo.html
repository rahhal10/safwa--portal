<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Loan Portal - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .app {
            min-height: 100vh;
        }

        .app-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .app-header h1 {
            color: #2d3748;
            margin: 0 0 0.5rem 0;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .app-header p {
            color: #718096;
            margin: 0;
            font-size: 1.1rem;
        }

        .app-main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .customer-form {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 200px);
        }

        .form-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 500px;
        }

        .form-card h2 {
            color: #2d3748;
            margin: 0 0 0.5rem 0;
            font-size: 1.875rem;
            font-weight: 700;
        }

        .form-card > p {
            color: #718096;
            margin: 0 0 2rem 0;
            font-size: 1rem;
        }

        .loan-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            color: #374151;
            font-weight: 600;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .required {
            color: #ef4444;
            font-weight: 700;
        }

        .form-group input {
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid #feb2b2;
        }

        .error-text {
            color: #ef4444;
            font-size: 0.875rem;
            font-weight: 500;
            margin-top: 0.25rem;
        }

        .loan-display {
            width: 100%;
        }

        .loan-header {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 2rem;
        }

        .customer-info h2 {
            color: #2d3748;
            margin: 0 0 1rem 0;
            font-size: 2rem;
            font-weight: 700;
        }

        .customer-details {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .customer-details p {
            color: #4a5568;
            margin: 0;
            font-size: 0.95rem;
        }

        .customer-details strong {
            color: #2d3748;
            font-weight: 600;
        }

        .reset-btn {
            background: #718096;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #4a5568;
        }

        .loans-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .loan-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .loan-header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .loan-id h3 {
            color: #2d3748;
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .status-badge {
            display: inline-block;
            padding: 0.375rem 0.875rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.approved {
            background: #d4f4dd;
            color: #22543d;
        }

        .status-badge.in-progress {
            background: #fef3c7;
            color: #92400e;
        }

        .amount {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }

        .loan-section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .loan-section h4 {
            color: #2d3748;
            margin: 0 0 1rem 0;
            font-size: 1.125rem;
            font-weight: 600;
        }

        .process-timeline {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .timeline-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .timeline-marker {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .timeline-marker.success {
            background: #48bb78;
            border: 2px solid #48bb78;
        }

        .timeline-marker.warning {
            background: #ed8936;
            border: 2px solid #ed8936;
        }

        .timeline-marker.pending {
            background: #cbd5e0;
            border: 2px solid #cbd5e0;
        }

        .timeline-content {
            flex: 1;
        }

        .step-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .step-name {
            color: #2d3748;
            font-weight: 500;
            font-size: 0.875rem;
        }

        .step-date {
            color: #718096;
            font-size: 0.75rem;
        }

        .points-list ul,
        .conditions-list ul {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .pain-point {
            color: #e53e3e;
            padding: 0.75rem;
            background: #fff5f5;
            border-left: 3px solid #e53e3e;
            border-radius: 0 6px 6px 0;
            font-size: 0.875rem;
        }

        .strength-point {
            color: #38a169;
            padding: 0.75rem;
            background: #f0fff4;
            border-left: 3px solid #38a169;
            border-radius: 0 6px 6px 0;
            font-size: 0.875rem;
        }

        .condition-item {
            color: #4a5568;
            padding: 0.75rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .app-header {
                padding: 1.5rem;
            }
            
            .app-header h1 {
                font-size: 2rem;
            }
            
            .app-main {
                padding: 1rem;
            }
            
            .form-card {
                padding: 2rem 1.5rem;
                margin: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>Bank Loan Portal</h1>
            <p>View your approved loans and contracts</p>
        </header>

        <main class="app-main">
            <!-- Customer Form -->
            <div id="customerForm" class="customer-form">
                <div class="form-card">
                    <h2>Customer Information</h2>
                    <p>Please enter your details to view your loan information</p>
                    
                    <form id="loanForm" class="loan-form">
                        <div class="form-group">
                            <label for="nationalId">
                                National ID Number
                                <span class="required">*</span>
                            </label>
                            <input
                                type="text"
                                id="nationalId"
                                name="nationalId"
                                placeholder="Enter your national ID (10-14 digits)"
                                maxlength="14"
                                required
                            />
                            <span class="error-text" id="nationalIdError"></span>
                        </div>

                        <div class="form-group">
                            <label for="birthDate">
                                Date of Birth
                                <span class="required">*</span>
                            </label>
                            <input
                                type="date"
                                id="birthDate"
                                name="birthDate"
                                required
                            />
                            <span class="error-text" id="birthDateError"></span>
                        </div>

                        <div class="form-group">
                            <label for="cardNumber">
                                Card Number
                                <span class="required">*</span>
                            </label>
                            <input
                                type="text"
                                id="cardNumber"
                                name="cardNumber"
                                placeholder="Enter your 16-digit card number"
                                maxlength="16"
                                required
                            />
                            <span class="error-text" id="cardNumberError"></span>
                        </div>

                        <button type="submit" class="submit-btn">
                            View Loan Information
                        </button>
                    </form>
                </div>
            </div>

            <!-- Loan Display -->
            <div id="loanDisplay" class="loan-display hidden">
                <div class="loan-header">
                    <div class="customer-info">
                        <h2>Loan Information</h2>
                        <div class="customer-details">
                            <p><strong>National ID:</strong> <span id="displayNationalId"></span></p>
                            <p><strong>Birth Date:</strong> <span id="displayBirthDate"></span></p>
                            <p><strong>Card Number:</strong> ****-****-****-<span id="displayCardNumber"></span></p>
                        </div>
                    </div>
                    <button class="reset-btn" onclick="resetForm()">
                        New Search
                    </button>
                </div>

                <div class="loans-container" id="loansContainer">
                    <!-- Loans will be dynamically inserted here -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // Mock loan data
        const mockLoanData = {
            loans: [
                {
                    id: 'LOAN001',
                    amount: 50000,
                    status: 'approved',
                    process: {
                        currentStep: 'final_approval',
                        steps: [
                            { name: 'application', status: 'completed', date: '2024-01-15' },
                            { name: 'document_verification', status: 'completed', date: '2024-01-18' },
                            { name: 'credit_check', status: 'completed', date: '2024-01-20' },
                            { name: 'initial_approval', status: 'completed', date: '2024-01-22' },
                            { name: 'final_approval', status: 'completed', date: '2024-01-25' }
                        ]
                    },
                    painPoints: [
                        'High interest rate compared to market average',
                        'Limited repayment flexibility',
                        'Processing time could be improved'
                    ],
                    strengthPoints: [
                        'Quick initial approval process',
                        'Competitive loan terms',
                        'Good customer support',
                        'Flexible collateral requirements'
                    ],
                    conditions: [
                        'Monthly payments due by 5th of each month',
                        'Early repayment penalty: 2% of remaining amount',
                        'Insurance required for loan amount above 25,000',
                        'Annual income verification required'
                    ]
                },
                {
                    id: 'LOAN002',
                    amount: 25000,
                    status: 'in_progress',
                    process: {
                        currentStep: 'credit_check',
                        steps: [
                            { name: 'application', status: 'completed', date: '2024-02-01' },
                            { name: 'document_verification', status: 'completed', date: '2024-02-03' },
                            { name: 'credit_check', status: 'in_progress', date: null },
                            { name: 'initial_approval', status: 'pending', date: null },
                            { name: 'final_approval', status: 'pending', date: null }
                        ]
                    },
                    painPoints: [
                        'Additional documentation required',
                        'Longer verification process than expected'
                    ],
                    strengthPoints: [
                        'Lower interest rate for first-time borrowers',
                        'No processing fees',
                        'Fast application submission'
                    ],
                    conditions: [
                        'Credit score minimum: 650',
                        'Employment verification required',
                        'Bank statements for last 6 months'
                    ]
                }
            ]
        };

        function validateForm(formData) {
            const errors = {};
            
            if (!formData.nationalId.trim()) {
                errors.nationalId = 'National ID is required';
            } else if (!/^\d{10,14}$/.test(formData.nationalId.replace(/\s/g, ''))) {
                errors.nationalId = 'National ID must be 10-14 digits';
            }
            
            if (!formData.birthDate) {
                errors.birthDate = 'Birth date is required';
            } else {
                const birthDate = new Date(formData.birthDate);
                const today = new Date();
                const age = today.getFullYear() - birthDate.getFullYear();
                if (age < 18 || age > 100) {
                    errors.birthDate = 'Must be between 18 and 100 years old';
                }
            }
            
            if (!formData.cardNumber.trim()) {
                errors.cardNumber = 'Card number is required';
            } else if (!/^\d{16}$/.test(formData.cardNumber.replace(/\s/g, ''))) {
                errors.cardNumber = 'Card number must be 16 digits';
            }
            
            return errors;
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0,
            }).format(amount);
        }

        function formatDate(dateString) {
            if (!dateString) return 'Pending';
            return new Date(dateString).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function displayLoanData(formData) {
            // Update customer info
            document.getElementById('displayNationalId').textContent = formData.nationalId;
            document.getElementById('displayBirthDate').textContent = formatDate(formData.birthDate);
            document.getElementById('displayCardNumber').textContent = formData.cardNumber.slice(-4);

            // Display loans
            const loansContainer = document.getElementById('loansContainer');
            loansContainer.innerHTML = '';

            mockLoanData.loans.forEach(loan => {
                const statusClass = loan.status === 'approved' ? 'approved' : 'in-progress';
                const statusText = loan.status === 'approved' ? 'Approved' : 'In Progress';

                const loanCard = document.createElement('div');
                loanCard.className = 'loan-card';
                loanCard.innerHTML = `
                    <div class="loan-header-info">
                        <div class="loan-id">
                            <h3>Loan ${loan.id}</h3>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="loan-amount">
                            <span class="amount">${formatCurrency(loan.amount)}</span>
                        </div>
                    </div>

                    <div class="loan-sections">
                        <div class="loan-section">
                            <h4>Process Status</h4>
                            <div class="process-timeline">
                                ${loan.process.steps.map((step, index) => `
                                    <div class="timeline-item">
                                        <div class="timeline-marker ${step.status}"></div>
                                        <div class="timeline-content">
                                            <div class="step-info">
                                                <span class="step-name">${step.name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</span>
                                                <span class="step-date">${formatDate(step.date)}</span>
                                            </div>
                                            ${step.status === 'in_progress' ? '<div style="color: #ed8936; font-size: 0.75rem; font-weight: 600;">Current Step</div>' : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="loan-section">
                            <h4>Pain Points</h4>
                            <div class="points-list">
                                <ul>
                                    ${loan.painPoints.map(point => `<li class="pain-point">${point}</li>`).join('')}
                                </ul>
                            </div>
                        </div>

                        <div class="loan-section">
                            <h4>Strength Points</h4>
                            <div class="points-list">
                                <ul>
                                    ${loan.strengthPoints.map(point => `<li class="strength-point">${point}</li>`).join('')}
                                </ul>
                            </div>
                        </div>

                        <div class="loan-section">
                            <h4>Conditions</h4>
                            <div class="conditions-list">
                                <ul>
                                    ${loan.conditions.map(condition => `<li class="condition-item">${condition}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
                loansContainer.appendChild(loanCard);
            });

            // Show loan display, hide form
            document.getElementById('customerForm').classList.add('hidden');
            document.getElementById('loanDisplay').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('loanForm').reset();
            document.getElementById('customerForm').classList.remove('hidden');
            document.getElementById('loanDisplay').classList.add('hidden');
            
            // Clear error messages
            document.getElementById('nationalIdError').textContent = '';
            document.getElementById('birthDateError').textContent = '';
            document.getElementById('cardNumberError').textContent = '';
        }

        // Form submission
        document.getElementById('loanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                nationalId: document.getElementById('nationalId').value,
                birthDate: document.getElementById('birthDate').value,
                cardNumber: document.getElementById('cardNumber').value
            };

            // Clear previous errors
            document.getElementById('nationalIdError').textContent = '';
            document.getElementById('birthDateError').textContent = '';
            document.getElementById('cardNumberError').textContent = '';

            // Validate form
            const errors = validateForm(formData);
            
            if (Object.keys(errors).length > 0) {
                if (errors.nationalId) document.getElementById('nationalIdError').textContent = errors.nationalId;
                if (errors.birthDate) document.getElementById('birthDateError').textContent = errors.birthDate;
                if (errors.cardNumber) document.getElementById('cardNumberError').textContent = errors.cardNumber;
                return;
            }

            // Simulate API call
            const submitBtn = e.target.querySelector('.submit-btn');
            submitBtn.textContent = 'Processing...';
            submitBtn.disabled = true;

            await new Promise(resolve => setTimeout(resolve, 1500));

            displayLoanData(formData);
            
            submitBtn.textContent = 'View Loan Information';
            submitBtn.disabled = false;
        });

        // Input formatting
        document.getElementById('nationalId').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        document.getElementById('cardNumber').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });
    </script>
</body>
</html>
